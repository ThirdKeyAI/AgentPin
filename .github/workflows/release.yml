name: Release Check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: |
          RUST_VER=$(grep '^version' crates/agentpin/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          PY_VER=$(grep 'version' python/pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          JS_VER=$(node -e "console.log(require('./javascript/package.json').version)")
          GO_VER=$(grep -E '^const Version' go/internal/version/version.go | sed 's/.*"\(.*\)".*/\1/')
          echo "Rust: $RUST_VER"
          echo "Python: $PY_VER"
          echo "JavaScript: $JS_VER"
          echo "Go: $GO_VER"
          # Maintenance branch: this release patches the Rust SDK only.
          if [ "$RUST_VER" != "0.3.1" ] || [ "$PY_VER" != "0.3.0" ] || [ "$JS_VER" != "0.3.0" ] || [ "$GO_VER" != "0.3.0" ]; then
            echo "::error::Unexpected version for the Rust-only 0.3.1 security backport"
            exit 1
          fi
          echo "Rust security backport: $RUST_VER; other SDKs remain 0.3.0"
