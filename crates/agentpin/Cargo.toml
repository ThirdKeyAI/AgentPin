[package]
name = "agentpin"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "Domain-anchored cryptographic identity protocol for AI agents"
license = "MIT"
authors = ["Jascha Wanger <jascha@thirdkey.ai>"]
repository = "https://github.com/ThirdKeyAI/AgentPin"
keywords = ["agent", "identity", "cryptography", "jwt", "ecdsa"]
categories = ["authentication", "cryptography"]

[features]
default = []
fetch = ["reqwest", "tokio", "async-trait"]
dns = ["hickory-resolver", "tokio", "async-trait"]

[dependencies]
p256 = { version = "0.14", features = ["ecdsa", "pem"] }
# Keep consumers' fresh resolutions above RUSTSEC-2026-0387's patched floor.
crypto-bigint = "0.7.6"
# OS randomness for mutual-authentication challenges, without the rand facade.
# Key generation uses p256's fallible built-in OS randomness API.
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.21"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
url = "2.4"
zeroize = "1"
async-trait = { version = "0.1", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
tokio = { version = "1.0", optional = true }
tempfile = { version = "3.0", optional = true }

# Optional dependency for DNS TXT cross-verification (v0.3.0)
hickory-resolver = { version = "0.26", optional = true }

[dev-dependencies]
tempfile = "3.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
